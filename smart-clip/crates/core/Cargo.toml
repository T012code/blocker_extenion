[package]
name = "smart-clip-core"
description = "Smart Clip's sync engine: sign-in, clips, images and live updates"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "charset", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4"] }
