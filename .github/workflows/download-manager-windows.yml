# Builds and tests Layó's Download Manager on Windows, and makes the installer.
name: Download manager (Windows)

on:
  push:
    branches: ["**"]
    # Pushing a tag like ldm-v0.2.0 also publishes a GitHub release (path filters
    # don't apply to tags). So does running it by hand with "release" ticked.
    tags: ["ldm-v*"]
    paths: ["layos-download-manager/**", ".github/workflows/download-manager-windows.yml"]
  pull_request:
    paths: ["layos-download-manager/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (tag ldm-v<version>) with the installer"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Writing is needed only to publish a release from an ldm-v* tag.
      contents: write
    timeout-minutes: 45
    defaults:
      run:
        working-directory: layos-download-manager
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: layos-download-manager

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust tests (engine, torrents, privacy, video, bridge)
        timeout-minutes: 20
        run: cargo test --workspace --exclude layos-download-manager

      - name: Extension tests
        working-directory: layos-download-manager/extension
        run: npm test

      - name: Build the extension
        working-directory: layos-download-manager/extension
        run: npm run package

      - name: Build the browser bridge
        run: cargo build --release -p ldm-native-host

      - name: Put the bridge, yt-dlp, ffmpeg and Deno where the installer expects them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'app/src-tauri'
          New-Item -ItemType Directory -Force "$app/binaries", "$app/tools" | Out-Null
          $triple = (rustc -vV | Select-String 'host: (.+)').Matches[0].Groups[1].Value
          Copy-Item target/release/ldm-native-host.exe "$app/binaries/ldm-native-host-$triple.exe"
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$app/tools/yt-dlp.exe"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "$app/tools/ffmpeg.exe"
          # yt-dlp needs a JavaScript runtime for YouTube (without one, most or all formats are missing).
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
          Copy-Item deno/deno.exe "$app/tools/deno.exe"
          & "$app/tools/deno.exe" --version | Select-Object -First 1
          & "$app/tools/yt-dlp.exe" --version
          & "$app/tools/ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: App interface tests
        working-directory: layos-download-manager/app
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install chromium
          node test/ui.e2e.mjs

      - name: Build the app and its installer
        working-directory: layos-download-manager/app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Check the installer carries the extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          & 7z x -y -oinstaller-check $setup.FullName | Out-Null
          foreach ($f in 'extensions/chromium/manifest.json', 'extensions/chromium/background/main.js', 'extensions/firefox/layos-download-manager.xpi', 'tools/deno.exe', 'tools/yt-dlp.exe') {
            $hit = Get-ChildItem installer-check -Recurse -File | Where-Object { $_.FullName.Replace('\', '/').EndsWith($f) }
            if (-not $hit) { throw "The installer is missing $f" }
            "found $f ($($hit[0].Length) bytes)"
          }
          $m = Get-ChildItem installer-check -Recurse -Filter manifest.json | Where-Object { $_.FullName -match 'extensions[\\/]chromium[\\/]manifest.json$' } | Select-Object -First 1
          $json = Get-Content $m.FullName -Raw | ConvertFrom-Json
          if (-not $json.key) { throw "The packaged extension has no key, so its id wouldn't match the bridge" }
          "manifest: $($json.name) $($json.version), manifest_version $($json.manifest_version)"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: layos-download-manager-windows
          path: |
            layos-download-manager/target/release/bundle/nsis/*.exe
            layos-download-manager/extension/dist/*.zip
          if-no-files-found: error

      # ---- Release: for a pushed tag like ldm-v0.2.0 (which must match the app's version),
      # or a manual run with "release" ticked (the tag ldm-v<version> is created on this commit).
      - name: Check the version for the release
        if: startsWith(github.ref, 'refs/tags/ldm-v') || inputs.release
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref }}".StartsWith('refs/tags/ldm-v')) {
            $tag = "${{ github.ref_name }}".Substring(5)
            if ($tag -ne $version) { throw "Tag ldm-v$tag doesn't match the app version $version" }
          }
          if (-not (Test-Path "docs/releases/$version.md")) { throw "Missing release notes docs/releases/$version.md" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Gather the release files (plain names; GitHub mangles spaces and ’)
        if: startsWith(github.ref, 'refs/tags/ldm-v') || inputs.release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "release/LayosDownloadManager_${env:VERSION}_x64-setup.exe"
          Copy-Item extension/dist/*.zip release/
          Get-ChildItem release | Format-Table Name, Length

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/ldm-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ldm-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Layó's Download Manager ${{ env.VERSION }}
          body_path: layos-download-manager/docs/releases/${{ env.VERSION }}.md
          files: layos-download-manager/release/*
          fail_on_unmatched_files: true
