# Builds and tests Layó's Download Manager on Windows, and makes the installer.
name: Download manager (Windows)

on:
  push:
    paths: ["layos-download-manager/**", ".github/workflows/download-manager-windows.yml"]
  pull_request:
    paths: ["layos-download-manager/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: layos-download-manager
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: layos-download-manager

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust tests (engine, torrents, privacy, video, bridge)
        run: cargo test --workspace --exclude layos-download-manager

      - name: Extension tests
        working-directory: layos-download-manager/extension
        run: npm test

      - name: Build the extension
        working-directory: layos-download-manager/extension
        run: npm run package

      - name: Build the browser bridge
        run: cargo build --release -p ldm-native-host

      - name: Build the app and its installer
        working-directory: layos-download-manager/app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: layos-download-manager-windows
          path: |
            layos-download-manager/target/release/bundle/nsis/*.exe
            layos-download-manager/target/release/ldm-native-host.exe
            layos-download-manager/extension/dist/*.zip
          if-no-files-found: error
