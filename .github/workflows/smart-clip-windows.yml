# Tests Smart Clip and builds its Windows installer.
name: Smart Clip (Windows)

on:
  push:
    branches: ["**"]
    # Pushing a tag like smart-clip-v1.0.0 also publishes a GitHub release.
    tags: ["smart-clip-v*"]
    paths: ["smart-clip/**", ".github/workflows/smart-clip-windows.yml"]
  pull_request:
    paths: ["smart-clip/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the migration and its tests on PostgreSQL
        run: bash smart-clip/supabase/tests/run-tests.sh

  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    needs: database
    permissions:
      # Writing is needed only to publish a release from a smart-clip-v* tag.
      contents: write
    timeout-minutes: 45
    defaults:
      run:
        working-directory: smart-clip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-clip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync engine tests (sign-in, clips, images, live updates)
        run: cargo test -p smart-clip-core

      - name: Lint (warnings fail the build)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Interface tests
        working-directory: smart-clip/app
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install chromium
          node test/ui.e2e.mjs

      - name: Build the app and its installer
        working-directory: smart-clip/app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: smart-clip-windows
          path: smart-clip/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Check the version for the release
        if: startsWith(github.ref, 'refs/tags/smart-clip-v')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".Substring(12)
          if ($tag -ne $version) { throw "Tag smart-clip-v$tag doesn't match the app version $version" }
          if (-not (Test-Path "docs/releases/$version.md")) { throw "Missing release notes docs/releases/$version.md" }
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "release/SmartClip_${version}_x64-setup.exe"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/smart-clip-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Clip ${{ env.VERSION }}
          body_path: smart-clip/docs/releases/${{ env.VERSION }}.md
          files: smart-clip/release/*
          fail_on_unmatched_files: true
