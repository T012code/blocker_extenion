[package]
name = "ldm-native-host"
description = "Browser bridge for Layó's Download Manager (Native Messaging host)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ldm-ipc = { path = "../ipc" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
ldm-engine = { path = "../engine" }
ldm-service = { path = "../service" }
ldm-testkit = { path = "../testkit" }
tempfile = "3"
