[package]
name = "ldm-service"
description = "Connects browser requests to the download engine (used by the app and the headless runner)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ldm-headless"
path = "src/main.rs"

[dependencies]
ldm-engine = { path = "../engine" }
ldm-ipc = { path = "../ipc" }
ldm-media = { path = "../media" }
ldm-torrent = { path = "../torrent" }
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
percent-encoding.workspace = true
reqwest.workspace = true

[dev-dependencies]
ldm-testkit = { path = "../testkit" }
tempfile = "3"
