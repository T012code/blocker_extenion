<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Layó's Download Manager</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="26" height="26">
    <h1>Layó's Download Manager</h1>
  </header>

  <section class="card status">
    <span class="badge" id="status-badge">Checking</span>
    <span class="muted small" id="status-detail"></span>
  </section>

  <label class="card row">
    <span>
      <span class="label">Take over browser downloads</span>
      <span class="muted small" id="bypass-hint">Hold Alt while clicking a link to skip</span>
    </span>
    <span class="switch"><input type="checkbox" id="enabled" aria-label="Take over browser downloads"><span></span></span>
  </label>

  <section class="card downloads" aria-labelledby="downloads-title">
    <h2 id="downloads-title">Downloads</h2>
    <ul id="downloads" aria-live="polite"></ul>
    <p class="muted small empty" id="downloads-empty">Downloads you start will show up here, with pause and continue.</p>
  </section>

  <section class="card returned" id="returned" hidden>
    <div class="card-head"><h2>Downloaded by the browser instead</h2><button class="small-btn" id="clear-history">Clear</button></div>
    <ul id="returned-list"></ul>
  </section>

  <footer>
    <div class="actions">
      <button class="primary" id="open-app">Open download manager</button>
      <button id="options">Settings</button>
    </div>
  </footer>
  <p class="credit">
    <img class="mark-light" src="../brand/layo-mark-light.svg" alt="">
    <img class="mark-dark" src="../brand/layo-mark-dark.svg" alt="">
    <span>Developed by <a href="https://layothedeveloper.com" target="_blank" rel="noopener">Layó</a></span>
  </p>
  <script type="module" src="popup.js"></script>
</body>
</html>
