[package]
name = "layos-download-manager"
description = "Layó's Download Manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "LayosDownloadManager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ldm-engine = { path = "../../crates/engine" }
ldm-ipc = { path = "../../crates/ipc" }
ldm-media = { path = "../../crates/media" }
ldm-service = { path = "../../crates/service" }
ldm-torrent = { path = "../../crates/torrent" }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
if-addrs = "0.15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
