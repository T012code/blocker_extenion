<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layo's Advanced Blocker</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../../icons/icon-32.png" alt="" width="24" height="24">
    <h1>Layo's Advanced Blocker</h1>
    <label class="power" title="Turn all protection on or off">
      <span class="sr-only">Protection everywhere</span>
      <input type="checkbox" class="switch" id="enabled" role="switch">
    </label>
  </header>

  <main>
    <section class="site" id="site" data-state="loading" aria-live="polite">
      <p class="site-host" id="host">Loading…</p>
      <p class="site-status" id="status"></p>
      <div class="site-stat">
        <span class="count" id="count">–</span>
        <span class="count-label">blocked on this page</span>
      </div>
      <button class="btn" id="toggle-site" type="button" hidden></button>
    </section>

    <section class="quick" aria-label="Quick settings">
      <label class="row">
        <span class="row-text"><span class="row-title">Ads</span></span>
        <input type="checkbox" class="switch" data-setting="rulesets.ads" role="switch">
      </label>
      <label class="row">
        <span class="row-text"><span class="row-title">Trackers</span></span>
        <input type="checkbox" class="switch" data-setting="rulesets.trackers" role="switch">
      </label>
      <label class="row">
        <span class="row-text"><span class="row-title">YouTube ads</span></span>
        <input type="checkbox" class="switch" data-setting="youtube" role="switch">
      </label>
      <label class="row">
        <span class="row-text"><span class="row-title">Malware &amp; miner warnings</span></span>
        <input type="checkbox" class="switch" data-setting="rulesets.security" role="switch">
      </label>
      <label class="row">
        <span class="row-text"><span class="row-title">Cookie banners</span></span>
        <input type="checkbox" class="switch" data-setting="annoyances" role="switch">
      </label>
    </section>
  </main>

  <footer class="actions">
    <button class="btn" id="picker" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l7 17 2.5-7.5L20 10z"/></svg>
      Hide an element
    </button>
    <button class="btn" id="settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Settings
    </button>
  </footer>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
